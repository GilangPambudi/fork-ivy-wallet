name: Paparazzi screenshots tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      record:
        description: 'Record new snapshots instead of verifying'
        type: boolean
        default: false

jobs:
  sceenshot_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GIT
        uses: actions/checkout@v4

      - name: Setup Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '18'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run Paparazzi screenshot tests
        if: ${{ !inputs.record }}
        run: ./gradlew verifyPaparazziDebug

      - name: Record Paparazzi snapshots
        if: ${{ inputs.record }}
        run: ./gradlew recordPaparazziDebug

      - name: Upload recorded snapshots
        if: ${{ inputs.record }}
        uses: actions/upload-artifact@v4
        with:
          name: paparazzi-snapshots
          path: '**/src/test/snapshots/images/*.png'
